<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Perfil do Paciente — Idade</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="font-sans">
    <div class="container mx-auto p-6 md:ml-72">
        <h1 class="text-2xl font-bold mb-4">Perfil do Paciente — Idade</h1>

        <div class="bg-white dark:bg-gray-800 p-4 rounded shadow mb-6">
            <h2 class="text-lg font-semibold mb-2">Distribuição por Faixa Etária</h2>
            <canvas id="idadeChart" style="max-width:700px; height:350px"></canvas>
        </div>

        <div id="idade-table" class="bg-white dark:bg-gray-800 p-4 rounded shadow">
            <h3 class="font-semibold mb-2">Tabela</h3>
            <div id="table-body">Carregando...</div>
        </div>
    </div>

    <script>
        async function fetchIdade() {
            const res = await fetch('/api/perfil_paciente/idade');
            if (!res.ok) { document.getElementById('table-body').innerText = 'Erro ao carregar dados.'; return; }
            const json = await res.json();
            const labels = json.labels || [];
            const data = json.data || [];

            const ctx = document.getElementById('idadeChart').getContext('2d');
            new Chart(ctx, { type: 'bar', data: { labels, datasets: [{ data, backgroundColor: '#3B82F6' }] }, options: { responsive: true } });

            const rows = labels.map((lab,i)=>`<div class="flex justify-between py-1 border-b"><div>${lab}</div><div>${data[i]}</div></div>`).join('');
            document.getElementById('table-body').innerHTML = `<div class="text-sm">${rows}</div>`;
        }
        fetchIdade();
    </script>
</body>
</html>
